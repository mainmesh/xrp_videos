{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email - xrpvideos</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; box-sizing: border-box; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);">
    <div class="w-full max-w-md p-8 rounded-2xl shadow-2xl text-center" style="background: rgba(30,27,75,0.5); border: 1px solid rgba(139,92,246,0.2);">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Check your inbox</h1>
        <p class="text-gray-300 mb-6">We've sent a verification link to your email. Click it within 24 hours to activate your account.</p>
        {% if username %}<p class="text-gray-400 text-sm mb-6">Signed up as <span class="text-purple-400 font-semibold">{{ username }}</span></p>{% endif %}
        <a href="{% url 'accounts:resend_verification' %}" class="block w-full py-3 rounded-lg font-semibold text-white" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">Resend verification email</a>
        <a href="{% url 'accounts:login' %}" class="block mt-3 text-purple-400 hover:text-purple-300 text-sm">Back to sign in</a>
    </div>
</body>
</html>
