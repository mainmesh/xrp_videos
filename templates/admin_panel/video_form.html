{% extends "admin_panel/base.html" %}
{% block title %}Create video{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold gradient-text mb-6">Create a new video</h1>

    <form method="post" class="space-y-5 dark-glass rounded-2xl p-8">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Title</label>
                <input name="title" required value="{{ form_data.title|default_if_none:'' }}" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">URL</label>
                <input name="url" required value="{{ form_data.url|default_if_none:'' }}" placeholder="https://..." class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Duration (seconds)</label>
                <input type="number" name="duration_seconds" min="1" value="{{ form_data.duration_seconds|default:30 }}" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
                <p class="text-xs text-gray-400 mt-1">How long a user must watch before reward is credited.</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Reward amount (USD)</label>
                <input type="number" step="0.01" name="reward_amount" min="0" value="{{ form_data.reward_amount|default:'0.50' }}" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
                <p class="text-xs text-gray-400 mt-1">Credited instantly on completion.</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Minimum tier</label>
                <select name="min_tier" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
                    <option value="">None (free for everyone)</option>
                    {% for t in tiers %}<option value="{{ t.id }}">{{ t.name }} (${{ t.price }})</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Thumbnail URL</label>
                <input name="thumbnail_url" value="{{ form_data.thumbnail_url|default_if_none:'' }}" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Countries (comma-separated ISO codes, blank = global)</label>
            <input name="countries" value="{{ form_data.countries|default_if_none:'' }}" placeholder="US,GB,KE" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Description</label>
            <textarea name="description" rows="3" class="w-full px-4 py-2.5 bg-slate-800/60 border border-purple-500/30 rounded-lg text-white focus:border-purple-500 focus:outline-none">{{ form_data.description|default_if_none:'' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
            <a href="{% url 'admin_panel:videos' %}" class="px-5 py-2.5 rounded-lg text-gray-300 hover:text-white">Cancel</a>
            <button type="submit" class="px-5 py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold transition">Create video</button>
        </div>
    </form>
</div>
{% endblock %}
